# CI: the full suite of every pull request, of every push to main and of every manual run (workflow_dispatch). The
# release workflow requires the job ci-passed, the last job, on the tagged commit; it passes only when every other job of
# this workflow passed, so the run of a push to main is the evidence of the commit that main receives (AGENTS). Every job
# installs npm and the packages of package-lock.json first (`make install-tools TOOLS=npm`, `make install-packages`), because
# the targets of kit come from the installed package @polyspec/kit. Every job runs its targets with
# `make ci-targets TARGETS="..."` (ci-targets of @polyspec/kit), which runs every target to its end
# past failures and writes a report: the log of each target, a summary with the first failure lines of each failed
# target, which is also the job summary, and the versions of the toolchains of the job. Every job uploads its report
# under `!cancelled()`. Every target of CHECK_TARGETS, the full suite of `make check`, runs in exactly one job of
# ci.yml (tests/scripts/workflow-rules.test.mts). No step or job has timeout-minutes: a build, an
# install or a whole suite is a long operation that the log shows line by line; only a test case and an adapter reply
# have their own deadline. The runner image is ubuntu-24.04. Each action is pinned to the commit of a release; PHP comes
# from the minor release of .php-version, and the records name the patch release that ran. Go, Python, Composer, alint
# and the other tools of mise.toml are installed by make install-tools at the digests of mise.lock.
# Language jobs and cross-language parity start independently; ci-passed requires all of them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on the same pull request are superseded: a new push to a pull request cancels the run of its previous push. A push to main has a ref of its
# own, and its run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ !cancelled() }}
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0, the release that the release workflow of @polyspec/kit pins: PHP of .php-version; Composer,
      # which the Composer manifests are read with, is a tool of mise.toml.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ !cancelled() }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: bootstrap the installed kit package
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: make install-packages
        if: ${{ !cancelled() }}
        run: make install-packages
      # Repository tool tests read Go metadata; layout needs alint and dependency policy needs Composer.
      - name: install repository check tools
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS="go php composer alint"
      - name: prepare Git hooks
        if: ${{ !cancelled() }}
        run: make hooks
      - name: make ci-targets
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="kit-check suppression-check bypass-check divergence-check link-state-check rules-check rebuild-check language-check duplication-check layout-check hooks-check owner-validate release-coverage parity-declarations-check docs-check evidence-check ordered-json-test-scripts typecheck lint-ts"
      # actions/upload-artifact v7.0.1: the report of this job, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-docs
          path: var/report/ci-targets/
          if-no-files-found: error
  parity:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
