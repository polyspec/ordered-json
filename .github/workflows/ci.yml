        run: make install-tools TOOLS=npm
      - name: make install-packages
        if: ${{ !cancelled() }}
        run: make install-packages
      # The tools of mise.lock (Go, Python, Composer, cargo-audit and the rest) with the phpcs and PHPStan of config/php-lint, the
      # Rust toolchain of rust-toolchain.toml, the crates of packages/rust/Cargo.lock, the Composer projects of the root and the
      # PHP packages (the PIE PHAR and the supplementary suite are tools of mise.lock).
      - name: install parity tools
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS="go rust php composer python uv"
      - name: install parity extractors
        if: ${{ !cancelled() }}
        run: make kit-install-symbols EXTRACTORS="go php"
      - name: install parity PHP generator
        if: ${{ !cancelled() }}
        run: make kit-install-php-arginfo
      - name: install parity packages
        if: ${{ !cancelled() }}
        run: make ordered-json-install-parity
      - name: make ci-targets
        if: ${{ !cancelled() }}
        env:
          JSON_TEST_SUITE: var/tools/mise/installs/http-jsontestsuite/latest
          TOOLS: node npm mise go rust php composer python uv
        run: make ci-targets TARGETS="toolchain-check cargo-downloads-check test-markers-check release-config-check verify-all parity-check"
      # actions/upload-artifact v7.0.1
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-parity
          path: var/report/ci-targets/
          if-no-files-found: error
