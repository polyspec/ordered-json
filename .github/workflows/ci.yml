  # The check of this workflow that the release workflow requires on the tagged commit. It runs after every other job,
  # also after a failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has
  # the result success, so a new job of this workflow is required once it is listed in needs.
  ci-passed:
    if: ${{ always() }}
    needs: [docs, parity, js, rust, go, php, php-ext, python]
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: make install-tools TOOLS=npm
        run: make install-tools TOOLS=npm
      - name: make install-packages
        run: make install-packages
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
