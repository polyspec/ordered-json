# CI: the full suite of every pull request, of every push to main and of every manual run (workflow_dispatch). The
# release workflow requires the job ci-passed, the last job, on the tagged commit; it passes only when every other job of
# this workflow passed, so the run of a push to main is the evidence of the commit that main receives (AGENTS). Every job
# installs npm and the packages of package-lock.json first (`make install-tools TOOLS=npm`, `make install-packages`), because
# the targets of kit come from the installed package @polyspec/kit. Every job runs its targets with
# `make ci-targets TARGETS="..."` (ci-targets of @polyspec/kit), which runs every target to its end
# past failures and writes a report: the log of each target, a summary with the first failure lines of each failed
# target, which is also the job summary, and the versions of the toolchains of the job. Every job uploads its report
# under `!cancelled()`. Every target of CHECK_TARGETS, the full suite of `make check`, runs in exactly one job of
# ci.yml and push-gate.yml (tests/scripts/workflow-rules.test.mts). No step or job has timeout-minutes: a build, an
# install or a whole suite is a long operation that the log shows line by line; only a test case and an adapter reply
# have their own deadline. The runner image is ubuntu-24.04. Each action is pinned to the commit of a release; PHP comes
# from the minor release of .php-version, and the records name the patch release that ran. Go, Python, Composer, alint
# and the other tools of mise.toml are installed by make install-tools at the digests of mise.lock.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runners are few: a new push to a pull request cancels the run of its previous push. A push to main has a ref of its
# own, and its run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ordered-json
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ordered-json
          fetch-depth: 0
      - name: check out sibling kit
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: polyspec/kit
          path: kit
      # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools
      # with mise; the tools of @polyspec/kit run the node of var/tools. The pinned npm of var/tools installs the packages, so the cache of the packageManager of package.json, which setup-node enables by default, is off.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ !cancelled() }}
        with:
          node-version-file: ordered-json/mise.toml
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0, the release that the release workflow of @polyspec/kit pins: PHP of .php-version; Composer,
      # which make dependency-policy-check reads the Composer manifests with, is a tool of mise.toml.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ !cancelled() }}
        with:
          php-version-file: ordered-json/.php-version
          tools: none
          coverage: none
      - name: install sibling kit npm
        if: ${{ !cancelled() }}
        run: make -C ../kit install-tools TOOLS=npm
      - name: install sibling kit packages
        if: ${{ !cancelled() }}
        run: make -C ../kit install-packages
      - name: build sibling kit
        if: ${{ !cancelled() }}
        run: make -C ../kit build
      - name: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: link project npm packages
        if: ${{ !cancelled() }}
        run: make npm-install DIR=.
      # The tools of mise.lock: alint, which make layout-check runs, ruff and vulture, which make lint-python runs, and Composer.
      - name: make install-tools
        if: ${{ !cancelled() }}
        run: make install-tools
      - name: make ci-targets
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="kit-check suppression-check bypass-check divergence-check link-state-check rules-check rebuild-check language-check test-markers-check duplication-check layout-check hooks-check owner-validate release-coverage release-config-check dependency-policy-check dependency-policy-mutation-check parity-declarations-check ordered-json-test-scripts typecheck lint-ts lint-python"
      # actions/upload-artifact v7.0.1: the report of this job, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-docs
          path: ordered-json/var/report/ci-targets/
          if-no-files-found: error
  suite:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ordered-json
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ordered-json
          fetch-depth: 0
      - name: check out sibling kit
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: polyspec/kit
          path: kit
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ !cancelled() }}
        with:
          node-version-file: ordered-json/mise.toml
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0, the release that the release workflow of @polyspec/kit pins: the latest patch release of
      # the minor release of .php-version, with phpize for the extension builds of the verification and PIE.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ !cancelled() }}
        with:
          php-version-file: ordered-json/.php-version
          tools: none
          coverage: none
      - name: install sibling kit npm
        if: ${{ !cancelled() }}
        run: make -C ../kit install-tools TOOLS=npm
      - name: install sibling kit packages
        if: ${{ !cancelled() }}
        run: make -C ../kit install-packages
      - name: build sibling kit
        if: ${{ !cancelled() }}
        run: make -C ../kit build
      - name: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: link project npm packages
        if: ${{ !cancelled() }}
        run: make npm-install DIR=.
      # The tools of mise.lock (Go, Python, Composer, cargo-audit and the rest) with the phpcs and PHPStan of config/php-lint, the
      # Rust toolchain of rust-toolchain.toml, the crates of packages/rust/Cargo.lock, the Composer projects of the root and the
      # PHP packages (the PIE PHAR and the supplementary suite are tools of mise.lock).
      - name: make install
        if: ${{ !cancelled() }}
        run: make install
      - name: make ci-targets
        if: ${{ !cancelled() }}
        env:
          JSON_TEST_SUITE: var/tools/mise/installs/http-jsontestsuite/latest
        run: make ci-targets TARGETS="toolchain-check cargo-downloads-check verify-all parity-check lint-rust lint-go lint-php lint-php-ext test-php-ext pie-check"
      # actions/upload-artifact v7.0.1
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-suite
          path: ordered-json/var/report/ci-targets/
          if-no-files-found: error
  # The check of this workflow that the release workflow requires on the tagged commit. It runs after every other job,
  # also after a failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has
  # the result success, so a new job of this workflow is required once it is listed in needs.
  ci-passed:
    if: ${{ always() }}
    needs: [docs, suite]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ordered-json
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ordered-json
          fetch-depth: 0
      - name: check out sibling kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: polyspec/kit
          path: kit
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ordered-json/mise.toml
          package-manager-cache: false
      - name: install sibling kit npm
        run: make -C ../kit install-tools TOOLS=npm
      - name: install sibling kit packages
        run: make -C ../kit install-packages
      - name: build sibling kit
        run: make -C ../kit build
      - name: make install-tools TOOLS=npm
        run: make install-tools TOOLS=npm
      - name: link project npm packages
        run: make npm-install DIR=.
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
