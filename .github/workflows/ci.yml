# CI: the full suite of every pull request, of every push to main and of every manual run (workflow_dispatch). The
# release workflow requires the job ci-passed, the last job, on the tagged commit; it passes only when every other job of
# this workflow passed, so the run of a push to main is the evidence of the commit that main receives (AGENTS). Every job
# runs its targets with `make ci-targets TARGETS="..."` (scripts/kit/ci-targets.mjs), which runs every target to its end
# past failures and writes a report: the log of each target, a summary with the first failure lines of each failed
# target, which is also the job summary, and the versions of the toolchains of the job. Every job uploads its report
# under `!cancelled()`. Every target of CHECK_TARGETS, the full suite of `make check`, runs in exactly one job of
# ci.yml and push-gate.yml (scripts/tests/test_workflow_rules.py). No step or job has timeout-minutes: a build, an
# install or a whole suite is a long operation that the log shows line by line; only a test case and an adapter reply
# have their own deadline. The runner image is ubuntu-24.04. Each action is pinned to the commit of a release; Python
# and PHP come from the minor releases of .python-version and .php-version, and the records name the patch releases
# that ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runners are few: a new push to a pull request cancels the run of its previous push. A push to main has a ref of its
# own, and its run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-node v6.5.0: the Node.js of .node-version runs the tools of scripts/kit. The repository installs no
      # npm package, so the cache of the packageManager of package.json, which setup-node enables by default, is off.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # shivammathur/setup-php 2.37.2: PHP of .php-version and the Composer release of config/toolchain.json, which
      # make dependency-policy-check reads the Composer manifests with.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        if: ${{ !cancelled() }}
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      - name: make ci-targets
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="kit-check hooks-check owner-validate release-coverage release-config-check dependency-policy-check"
      # actions/upload-artifact v7.0.1: the report of this job, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-docs
          path: var/report/ci-targets/
          if-no-files-found: error
  suite:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-python v6.3.0: the latest patch release of the minor release of .python-version.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: ${{ !cancelled() }}
        with:
          python-version-file: .python-version
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # actions/setup-go v6.5.0: the toolchain line of packages/ordered-json-go/go.mod.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: ${{ !cancelled() }}
        with:
          go-version-file: packages/ordered-json-go/go.mod
          cache: false
      # shivammathur/setup-php 2.37.2: the latest patch release of the minor release of .php-version, with phpize
      # for the extension builds of the verification and PIE.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        if: ${{ !cancelled() }}
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      # npm and Go of the checkout, the Rust toolchain of rust-toolchain.toml, the crates of packages/ordered-json-rust/Cargo.lock, the PIE
      # PHAR and the supplementary suite of external-inputs.json; the only step that downloads.
      - name: make install
        if: ${{ !cancelled() }}
        run: make install
      - name: make ci-targets
        if: ${{ !cancelled() }}
        env:
          JSON_TEST_SUITE: .cache/JSONTestSuite
        run: make ci-targets TARGETS="kit-test toolchain-check cargo-downloads-check verify-all clippy go-vet pie-check"
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-suite
          path: var/report/ci-targets/
          if-no-files-found: error
  # The Python package supports the floor minor 3.11 as well as the minor release of .python-version. The job runs
  # its package tests, its case listing and its symbol report with the interpreter of the matrix
  # (make python-package-check, scripts/python_check.py), which the job suite cannot do for a minor below the pin of
  # the repository tools; the second entry of the matrix stays equal to .python-version.
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep 3.14 equal to the minor release of .python-version.
        python: ['3.11', '3.14']
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-python v6.3.0: the interpreter of the matrix, the floor minor and the pinned minor.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: ${{ !cancelled() }}
        with:
          python-version: ${{ matrix.python }}
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: make ci-targets
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="python-package-check"
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-python-${{ matrix.python }}
          path: var/report/ci-targets/
          if-no-files-found: error
  # The check of this workflow that the release workflow requires on the tagged commit. It runs after every other job,
  # also after a failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has
  # the result success, so a new job of this workflow is required once it is listed in needs.
  ci-passed:
    if: ${{ always() }}
    needs: [docs, suite, python]
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
