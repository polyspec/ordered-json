      # actions/upload-artifact v7.0.1
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-python
          path: var/report/ci-targets/
