# CI: the full suite of every pull request, of every push to main and of every manual run (workflow_dispatch). The
# release workflow requires the job ci-passed, the last job, on the tagged commit; it passes only when every other job of
# this workflow passed, so the run of a push to main is the evidence of the commit that main receives (AGENTS). Every job
# installs npm and the packages of package-lock.json first (`make install-tools TOOLS=npm`, `make install-packages`), because
# the targets of kit come from the installed package @polyspec/kit. Every job runs its targets with
# `make ci-targets TARGETS="..."` (ci-targets of @polyspec/kit), which runs every target to its end
# past failures and writes a report: the log of each target, a summary with the first failure lines of each failed
# target, which is also the job summary, and the versions of the toolchains of the job. Every job uploads its report
# under `!cancelled()`. Every target of CHECK_TARGETS, the full suite of `make check`, runs in exactly one job of
# ci.yml and push-gate.yml (scripts/tests/test_workflow_rules.py). No step or job has timeout-minutes: a build, an
# install or a whole suite is a long operation that the log shows line by line; only a test case and an adapter reply
# have their own deadline. The runner image is ubuntu-24.04. Each action is pinned to the commit of a release; Python
# and PHP come from the minor releases of .python-version and .php-version, and the records name the patch releases
# that ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runners are few: a new push to a pull request cancels the run of its previous push. A push to main has a ref of its
# own, and its run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-node v6.5.0: the Node.js of .node-version runs the tools of @polyspec/kit. The pinned npm of var/tools
      # installs the packages, so the cache of the packageManager of package.json, which setup-node enables by default, is off.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # shivammathur/setup-php v2, the commit that the release workflow of @polyspec/kit pins: PHP of .php-version and the
      # Composer release of config/toolchain.json, which make dependency-policy-check reads the Composer manifests with.
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        if: ${{ !cancelled() }}
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      - name: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: make install-packages
        if: ${{ !cancelled() }}
        run: make install-packages
      # alint of config/toolchain.json, which make layout-check runs.
      - name: make install-tools
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=alint
      - name: make ci-targets
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="kit-check layout-check hooks-check owner-validate release-coverage release-config-check dependency-policy-check dependency-policy-mutation-check"
      # actions/upload-artifact v7.0.1: the report of this job, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-docs
          path: var/report/ci-targets/
          if-no-files-found: error
  suite:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-python v6.3.0: the latest patch release of the minor release of .python-version.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: ${{ !cancelled() }}
        with:
          python-version-file: .python-version
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # shivammathur/setup-php v2, the commit that the release workflow of @polyspec/kit pins: the latest patch release of
      # the minor release of .php-version, with phpize for the extension builds of the verification and PIE.
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        if: ${{ !cancelled() }}
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      - name: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: make install-packages
        if: ${{ !cancelled() }}
        run: make install-packages
      # The tools of config/toolchain.json and the Go of the kit pin, the Rust toolchain of rust-toolchain.toml, the crates of
      # packages/ordered-json-rust/Cargo.lock, the PIE PHAR and the supplementary suite of external-inputs.json.
      - name: make install
        if: ${{ !cancelled() }}
        run: make install
      - name: make ci-targets
        if: ${{ !cancelled() }}
        env:
          JSON_TEST_SUITE: .cache/JSONTestSuite
        run: make ci-targets TARGETS="toolchain-check cargo-downloads-check verify-all clippy go-vet pie-check"
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-suite
          path: var/report/ci-targets/
          if-no-files-found: error
  # The Python package runs under the pinned interpreter of make install-tools, the minor release of .python-version, which
  # is also its requires-python (scripts/tests/test_python_requires.py). The job runs its package tests, its case listing and
  # its symbol report (make python-package-check, scripts/python_check.py).
  python:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: make install-packages
        if: ${{ !cancelled() }}
        run: make install-packages
      - name: make install-tools
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS="uv python"
      - name: make ci-targets
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="python-package-check"
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-python
          path: var/report/ci-targets/
          if-no-files-found: error
  # The check of this workflow that the release workflow requires on the tagged commit. It runs after every other job,
  # also after a failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has
  # the result success, so a new job of this workflow is required once it is listed in needs.
  ci-passed:
    if: ${{ always() }}
    needs: [docs, suite, python]
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: make install-tools TOOLS=npm
        run: make install-tools TOOLS=npm
      - name: make install-packages
        run: make install-packages
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
