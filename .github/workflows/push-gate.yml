# The push gate in CI. The pre-push hook .githooks/pre-push refuses a push while a feature of
# docs/features.md is partial, but a push from a checkout without the hook does not run it. This job
# runs the same gate, scripts/push_gate.py, on the pushed commit of every branch and on the head
# commit of every pull request: it fails while a feature is partial, naming each one, and when
# .githooks/pre-push is not tracked with mode 100755. The full verification is not run here.
name: push-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  push-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: push gate
        run: python3 scripts/push_gate.py commit "${{ github.event.pull_request.head.sha || github.sha }}"
