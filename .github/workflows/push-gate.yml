# The push gate in CI. The pre-push hook .githooks/pre-push refuses a push while a task of
# docs/plans/execution/checklist.md is [~], but a push from a checkout without the hook does not run it. This job runs
# the same gate, make push-gate-commit (push-gate of @polyspec/kit), on the pushed commit of every branch and on the head
# commit of every pull request: it fails while a task of the checklist is [~], naming each one, and when the commit does
# not track .githooks/pre-push and .githooks/pre-commit with mode 100755. The release workflow requires this job on the
# tagged commit, so it also runs the document check, make docs-check (check-documents of @polyspec/kit), the evidence
# check, make evidence-check (scripts/check-evidence.mts), and the check of the commit message, make commits-check: a
# commit whose documents, checklist, feature record or message fail their own checks does not reach a release. The
# targets run through make ci-targets, which runs each after a failed one and writes the report. A step runs a make target, never a
# script directly, so the environment and the prechecks of the Makefile apply. The full verification is not run here. The
# runner image and each action are exact releases, Node.js and Python come from mise.toml and mise.lock,
# so the job does not change with a new release of any of them. The push trigger names the branches, so the push of a tag does not
# start this job again: the release workflow requires the check push-gate of the commit that the tag names, and a second run
# on that commit would be queued while the release verifies it.
name: push-gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  push-gate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ordered-json
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ordered-json
          fetch-depth: 0
      - name: check out sibling kit
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: polyspec/kit
          path: kit
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ !cancelled() }}
        with:
          node-version-file: ordered-json/mise.toml
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ !cancelled() }}
        with:
          php-version-file: ordered-json/.php-version
          tools: none
          coverage: none
      # The targets come from the installed package @polyspec/kit: npm first, then the packages of package-lock.json.
      - name: install sibling kit npm
        if: ${{ !cancelled() }}
        run: make -C ../kit install-tools TOOLS=npm
      - name: install sibling kit packages
        if: ${{ !cancelled() }}
        run: make -C ../kit install-packages
      - name: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: make install-packages
        if: ${{ !cancelled() }}
        run: make install-packages
      - name: make install-tools
        if: ${{ !cancelled() }}
        run: make install-tools
      - name: make ci-targets
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="push-gate-commit docs-check evidence-check commits-check"
      # actions/upload-artifact v7.0.1
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-push-gate
          path: ordered-json/var/report/ci-targets/
          if-no-files-found: error
