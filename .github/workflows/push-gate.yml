# The push gate in CI. The pre-push hook .githooks/pre-push refuses a push while a feature of
# docs/features.md is partial, but a push from a checkout without the hook does not run it. This job
# runs the same gate, make push-gate (scripts/push_gate.py), on the pushed commit of every branch and on the
# head commit of every pull request: it fails while a feature is partial or a task of
# docs/plans/execution-checklist.md is [~], naming each one, and when .githooks/pre-push or
# .githooks/pre-commit is not tracked with mode 100755. The ruleset main of .github/ruleset.json requires this job, so
# it also runs the documentation check, make docs-check (scripts/docs_check.py), which reads only Python and Git: a
# commit whose documents, feature tracker or checklist fail their own checks does not reach main. That check runs
# also after a failed gate. A step runs its make target, never a script
# directly, so the environment and the prechecks of the Makefile apply. The full verification is not run here. The
# runner image, each action and Python are exact releases, so the job does not change with a new
# release of any of them.
name: push-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  push-gate:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # actions/setup-python v6.3.0. .python-version pins the minor release 3.9; 3.9.25 is the last 3.9
      # release that actions/python-versions builds for ubuntu-24.04.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9.25'
      - name: push gate
        run: make push-gate COMMIT="${{ github.event.pull_request.head.sha || github.sha }}"
      - name: documentation check
        if: ${{ !cancelled() }}
        run: make docs-check
