# Release: a tag push creates the GitHub Release of the tag. Every commit of main passed the full suite on its push; the
# maintainer releases by tagging a commit of main
# vX.Y.Z after a version-bump pull request, or go/vX.Y.Z for the Go module of go/. In a tag filter * does not match /,
# so '**/v*' covers the tag of a Go module at any depth. The steps run in order and stop at the first failure: make
# release-verify requires the tagged commit on origin/main with the check runs push-gate and ci-passed concluded
# success, without running the tests again; make release-versions requires the version of the tag in every manifest and
# its section in CHANGELOG.md; make release-assets builds the package archives (npm pack and a zip of each Composer
# package; the Cargo package is not released as an archive and is consumed by git tag); make release-publish creates
# the GitHub Release with the section as notes and the archives attached, and a Go tag builds and attaches nothing
# (scripts/release.py). TAG reaches the make targets through the environment, never as shell text. Each step runs a
# make target. The runner image and each action are exact releases, as in ci.yml.
name: release

on:
  push:
    tags: ['v*', '**/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v6.1.0: the whole history and every branch, so origin/main is there for the ancestry check.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      # The toolchains of the job suite of ci.yml: make tools installs the pinned Rust toolchain, npm and crates and
      # then compares every tool with its pin, so Python, Node.js, Go and PHP come from the pin files as there.
      # actions/setup-python v6.3.0: the latest patch release of the minor release of .python-version.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      # actions/setup-node v6.5.0. The repository has no npm lock file, so the cache of setup-node is off.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # actions/setup-go v6.5.0: the toolchain line of go/go.mod.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go/go.mod
          cache: false
      # shivammathur/setup-php 2.37.2: the latest patch release of the minor release of .php-version.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version-file: .php-version
          coverage: none
      - name: make tools
        run: make tools
      - name: verify the tagged commit
        run: make release-verify
      - name: check the versions
        run: make release-versions
      - name: build the assets
        run: make release-assets
      - name: create the release
        run: make release-publish
