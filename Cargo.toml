[package]
name = "ordered-json"
version = "0.0.1"
edition = "2021"
rust-version = "1.71"
description = "Strict JSON with insertion-ordered associative objects and exact number literals"
readme = "README.md"
repository = "https://github.com/polyspec/ordered-json.git"

[lib]
path = "rust/src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }

[dev-dependencies]
sha2 = "0.10"
serde_json = "1"
