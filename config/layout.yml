# The folder layout of ordered-json (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml,
# a copy of @polyspec/kit, and the map of this repository. A rule named here replaces the field of the common rule, so a
# list repeats the common entries and adds the entries of this repository, each with its reason right above it.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: ordered-json }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: ordered-json }

  - id: layout-root-tests
    paths:
      - "tests/*"
      # The consumer projects in which make release-consumer installs the release archives (config/release.json).
      - "!tests/release-consumer"
      # The node:test tests of the tools of scripts/ and benchmarks/run.mts (make ordered-json-test-scripts).
      - "!tests/scripts"

  # S5: the root files of ordered-json beyond the list of kit (K145).
  # external-inputs.json: the pinned downloads of make ordered-json-install-external (the PIE PHAR and the supplementary suite),
  # scripts/external-inputs.mts.
  - id: layout-root-files
    vars: { root_files: "{external-inputs.json}" }

  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "!tests/kit/fixture/**"

  # K245 exception: each runtime package keeps its AGENTS, CHANGELOG and Makefile beside its code, because its registry
  # releases that folder and its Go module tag names it. The Makefile of a package only runs the targets of the root
  # (make -C ../.. verify-<runtime>), and its changelog and rules hold the changes of that runtime alone; the root files
  # would merge them into one history.
  - id: management-files-at-root
    paths:
      - "packages/**/AGENTS*.md"
      - "packages/**/CHANGELOG*.md"
      - "packages/**/Makefile"
      - "!packages/*/AGENTS.md"
      - "!packages/*/AGENTS.ko.md"
      - "!packages/*/CHANGELOG.md"
      - "!packages/*/CHANGELOG.ko.md"
      - "!packages/*/Makefile"
