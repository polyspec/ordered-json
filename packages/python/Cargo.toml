# Generated by binding from the interface contract; do not edit. Run make bindings to write it again.
[package]
name = "polyspec-json-python"
version = "0.0.27"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
panic-test = []
fault-test = ["polyspec-json/fault-test"]

[dependencies]
polyspec-json = { path = "../rust" }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.2", features = ["construct", "lock"] }
pyo3 = { version = "=0.30.1", features = ["abi3-py314", "extension-module"] }

[lints]
workspace = true
