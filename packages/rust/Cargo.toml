[package]
name = "polyspec-ordered-json"
version = "0.0.8"
edition = "2021"
rust-version = "1.99.0"
description = "Strict JSON with insertion-ordered associative objects and exact number literals"
readme = "README.md"
repository = "https://github.com/polyspec/ordered-json.git"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_ignored = "=0.1.14"
serde_json = { version = "=1.0.151", features = ["raw_value", "unbounded_depth"] }

[lib]
name = "polyspec_ordered_json"
path = "src/lib.rs"

[dev-dependencies]
sha2 = "0.10"
serde_json = "1"

# The crate is its own workspace, whose lints kit requires (config/cargo.schema.json): no unsafe code, and every allow
# attribute names its reason.
[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
