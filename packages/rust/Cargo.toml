[package]
name = "polyspec-json"
version = "0.0.26"
license = "MIT"
edition = "2021"
rust-version = "1.99.0"
description = "Strict JSON with insertion-ordered associative objects and exact number literals"
readme = "README.md"
repository = "https://github.com/polyspec/json.git"
publish = false
# The package holds the interface contract of the bindings beside the source, so that a library that takes or gives a
# json_value reads the value table from the package that Cargo resolved (binding design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json", "/README.md"]

[dependencies]
ryu-js = "=1.0.3"
# The kind interface that the generated bindings read from the core error (binding design E-1, I-2 (3)). The git source is the
# binding repository at the tag of its release, the same source as the generated binding crates and the release of the tool
# binding that package.json names (binding CK-20, CK-70).
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.2" }
serde = { version = "=1.0.229", features = ["derive"] }
# 1.0.154 is the exact pin of polyspec-binding-core with its feature fault-test, which the tests and the binding crates turn on.
serde_json = { version = "=1.0.154", features = ["raw_value", "unbounded_depth"] }

[lib]
name = "polyspec_json"
path = "src/lib.rs"

[features]
# G-5, X-1: compiles the arming of the fault injection points of `fault`; a generated binding crate turns it on for its
# tests only, and a release build never does (binding design 3.6).
fault-test = ["polyspec-binding-core/fault-test"]

[dev-dependencies]
# tests/contract.rs arms the fault injection points of the cases that name them, as a generated binding test does. The
# core is its own dev-dependency with fault-test, so every test build of the core, a plain cargo test included, has the
# points (binding GN-5).
polyspec-json = { path = ".", features = ["fault-test"] }
base64 = "=0.22.1"
libtest-mimic = "=0.8.2"
sha2 = "0.10"
serde_json = "1"

# The official examples run as the trials of libtest-mimic, one test per case, so the harness of the test is its own.
[[test]]
name = "official"
harness = false

# One trial per case of contracts/core.json, so the harness of the test is libtest-mimic.
[[test]]
name = "contract"
harness = false

# The lints of the root workspace (Cargo.toml of the repository), which make lint-rust (cargo clippy) reads.
[lints]
workspace = true
