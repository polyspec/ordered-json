[package]
name = "polyspec-json-node"
version = "0.0.27"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "polyspec_json_node"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
panic-test = []
fault-test = ["polyspec-json/fault-test"]

[build-dependencies]
